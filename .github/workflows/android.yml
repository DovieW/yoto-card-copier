name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Memory-policy checks
        run: |
          mkdir -p /tmp/yoto-copy-tests
          javac -d /tmp/yoto-copy-tests app/src/main/java/dev/dovie/yotocopy/TagMemory.java tests/TagMemoryTest.java
          java -cp /tmp/yoto-copy-tests dev.dovie.yotocopy.TagMemoryTest
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yoto-card-copier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
